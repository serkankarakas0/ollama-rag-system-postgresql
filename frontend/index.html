<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Lokal RAG Sistemi</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e8e8e8;
    --muted: #8a8f98;
    --accent: #5b8cff;
    --ok: #4caf50;
    --err: #e05353;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  input[type=file], select, textarea {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 10px;
    font-size: 14px;
  }
  textarea { min-height: 70px; resize: vertical; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: #2a2e37; }
  .row { display: flex; gap: 10px; align-items: center; }
  .doc-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .doc-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #0f1115; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px;
  }
  .doc-item small { color: var(--muted); }
  .steps { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .step {
    font-size: 13px; padding: 8px 12px; border-radius: 8px;
    background: #0f1115; border-left: 3px solid var(--accent);
  }
  .step.error { border-left-color: var(--err); color: var(--err); }
  .step.done { border-left-color: var(--ok); }
  .step details { margin-top: 6px; color: var(--muted); font-size: 12px; }
  .answer {
    white-space: pre-wrap; font-size: 14.5px; line-height: 1.55;
    background: #0f1115; border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    min-height: 60px;
  }
  .status-badge { font-size: 12px; padding: 3px 8px; border-radius: 20px; background: #0f1115; color: var(--muted); }
</style>
</head>
<body>
<div class="container">
  <div>
    <h1>🗂️ Lokal RAG Sistemi</h1>
    <div class="sub">PostgreSQL + pgvector · Lokal embedding · Groq API</div>
  </div>

  <div class="panel">
    <h2>1. Dosya Yükle</h2>
    <div class="row">
      <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md">
      <button id="uploadBtn">Yükle</button>
    </div>
    <div id="uploadStatus" class="sub" style="margin-top:8px;"></div>
    <div class="doc-list" id="docList"></div>
  </div>

  <div class="panel">
    <h2>2. Soru Sor</h2>
    <div class="row" style="margin-bottom:10px;">
      <select id="docSelect">
        <option value="">Tüm dokümanlarda ara</option>
      </select>
    </div>
    <textarea id="questionInput" placeholder="Yüklediğin dosyayla ilgili bir soru yaz..."></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="askBtn">Sor</button>
      <span class="status-badge" id="askStatus"></span>
    </div>
  </div>

  <div class="panel">
    <h2>3. İzlenen Adımlar (Canlı)</h2>
    <div class="steps" id="stepsBox">
      <div class="step" style="border-left-color:#444;color:var(--muted);">Henüz bir soru sorulmadı.</div>
    </div>
  </div>

  <div class="panel">
    <h2>4. Cevap</h2>
    <div class="answer" id="answerBox">—</div>
  </div>
</div>

<script>
const API_BASE = ""; // aynı origin'den servis ediliyorsa boş bırak, değilse "http://localhost:8000" yaz

async function loadDocuments() {
  const res = await fetch(`${API_BASE}/documents`);
  const docs = await res.json();

  const docList = document.getElementById("docList");
  const docSelect = document.getElementById("docSelect");
  docList.innerHTML = "";
  docSelect.innerHTML = '<option value="">Tüm dokümanlarda ara</option>';

  docs.forEach(doc => {
    const item = document.createElement("div");
    item.className = "doc-item";
    item.innerHTML = `
      <span>📄 ${doc.filename} <small>(${doc.chunk_count} parça)</small></span>
      <button class="secondary" onclick="deleteDoc(${doc.id})">Sil</button>
    `;
    docList.appendChild(item);

    const opt = document.createElement("option");
    opt.value = doc.id;
    opt.textContent = doc.filename;
    docSelect.appendChild(opt);
  });
}

async function deleteDoc(id) {
  await fetch(`${API_BASE}/documents/${id}`, { method: "DELETE" });
  loadDocuments();
}

document.getElementById("uploadBtn").addEventListener("click", async () => {
  const fileInput = document.getElementById("fileInput");
  const statusEl = document.getElementById("uploadStatus");
  if (!fileInput.files.length) {
    statusEl.textContent = "Lütfen bir dosya seçin.";
    return;
  }

  const formData = new FormData();
  formData.append("file", fileInput.files[0]);

  statusEl.textContent = "Yükleniyor ve işleniyor...";
  try {
    const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: formData });
    if (!res.ok) throw new Error((await res.json()).detail || "Yükleme başarısız");
    const data = await res.json();
    statusEl.textContent = `✅ "${data.filename}" yüklendi (${data.chunk_count} parçaya bölündü).`;
    fileInput.value = "";
    loadDocuments();
  } catch (err) {
    statusEl.textContent = `❌ Hata: ${err.message}`;
  }
});

document.getElementById("askBtn").addEventListener("click", () => {
  const question = document.getElementById("questionInput").value.trim();
  const documentId = document.getElementById("docSelect").value;
  const stepsBox = document.getElementById("stepsBox");
  const answerBox = document.getElementById("answerBox");
  const askStatus = document.getElementById("askStatus");
  const askBtn = document.getElementById("askBtn");

  if (!question) return;

  stepsBox.innerHTML = "";
  answerBox.textContent = "";
  askStatus.textContent = "çalışıyor...";
  askBtn.disabled = true;

  let url = `${API_BASE}/ask?question=${encodeURIComponent(question)}`;
  if (documentId) url += `&document_id=${documentId}`;

  const evtSource = new EventSource(url);

  evtSource.addEventListener("step", (e) => {
    const data = JSON.parse(e.data);
    const stepEl = document.createElement("div");
    stepEl.className = "step";
    let html = data.message;
    if (data.details) {
      html += `<details><summary>Bulunan parçaları göster</summary><pre>${JSON.stringify(data.details, null, 2)}</pre></details>`;
    }
    stepEl.innerHTML = html;
    stepsBox.appendChild(stepEl);
    stepsBox.scrollTop = stepsBox.scrollHeight;
  });

  evtSource.addEventListener("answer_chunk", (e) => {
    const data = JSON.parse(e.data);
    answerBox.textContent += data.text;
  });

  evtSource.addEventListener("done", () => {
    askStatus.textContent = "tamamlandı ✓";
    askBtn.disabled = false;
    evtSource.close();
  });

  evtSource.addEventListener("error", (e) => {
    let msg = "Bağlantı hatası";
    try { msg = JSON.parse(e.data).message; } catch (_) {}
    const stepEl = document.createElement("div");
    stepEl.className = "step error";
    stepEl.textContent = `❌ ${msg}`;
    stepsBox.appendChild(stepEl);
    askStatus.textContent = "hata";
    askBtn.disabled = false;
    evtSource.close();
  });
});

loadDocuments();
</script>
</body>
</html>
